# Default deny, then allow only what the system needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: gauntlet}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: proxy-ingress, namespace: gauntlet}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: gauntlet-proxy}}
  policyTypes: [Ingress]
  ingress:
    - ports: [{port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: model-ingress-from-proxy-only, namespace: gauntlet}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: mock-llm}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/name: gauntlet-proxy}}}]
      ports: [{port: 8089}]
