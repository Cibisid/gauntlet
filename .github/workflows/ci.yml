name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: python -m mypy
      - name: Unit + integration tests with coverage gate
        run: pytest --cov=src/gauntlet --cov-report=xml
      - name: Case set is reproducible from the generator
        if: matrix.python == '3.12'
        run: |
          python scripts/make_synthetic_cases.py --out /tmp/regen.jsonl
          diff -q /tmp/regen.jsonl cases/trialbridge/synthetic_v1.jsonl

  release-gate:
    # Gates the release a PR proposes (releases/trialbridge/candidate.yaml)
    # against production (baseline.yaml) and publishes the report.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Run gate
        run: |
          set +e
          OUT_DIR=out scripts/gate_demo.sh
          status=$?
          cat out/gate-report.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-results
          path: out/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: SAST (Bandit)
        run: bandit -r src
      - name: SAST (Semgrep)
        run: pipx run semgrep scan --config p/python --config p/secrets --error
      - name: Dependency audit
        run: pip-audit
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: SBOM (CycloneDX via Syft)
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t gauntlet:ci .
      - name: Smoke test (mock server healthz + one gate in compose)
        run: |
          mkdir -p out && chmod 777 out
          docker compose up --abort-on-container-exit --exit-code-from gate
          test -s out/gate-report.md
      - name: Container scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: gauntlet:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
